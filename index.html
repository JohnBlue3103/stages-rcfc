<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stages Vacances — RCFC</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body {
      background: radial-gradient(ellipse at top, #1a3260 0%, #0d1f3c 60%);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .hero { text-align: center; margin: 40px auto 30px; padding: 0 16px; }
    .hero img {
      width: 110px; height: 110px; border-radius: 50%;
      border: 3px solid #C8A84B; box-shadow: 0 0 32px #C8A84B44; margin-bottom: 16px;
    }
    .hero h1 {
      color: #C8A84B; font-size: 1.4rem; font-weight: 900;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;
    }
    .hero p { color: #8fa8c8; font-size: 0.9rem; letter-spacing: 0.5px; }
    .divider { width: 60px; height: 2px; background: linear-gradient(to right, transparent, #C8A84B, transparent); margin: 16px auto; }

    .infos-pratiques {
      max-width: 640px; margin: 0 auto 36px; background: #162847;
      border: 1.5px solid #1e3a5f; border-radius: 16px; padding: 18px 24px;
      display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
    }
    .infos-pratiques div { display: flex; align-items: center; gap: 8px; color: #8fa8c8; font-size: 0.85rem; }
    .infos-pratiques strong { color: #fff; }
    .infos-pratiques svg { color: #C8A84B; flex-shrink: 0; }

    .periodes-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
      max-width: 780px; margin: 0 auto; padding: 0 20px;
    }
    @media(max-width: 640px) { .periodes-grid { grid-template-columns: 1fr; } }

    .periode-card {
      background: #162847; border: 1.5px solid #1e3a5f; border-radius: 20px;
      padding: 28px 24px; color: #fff; transition: all 0.25s; position: relative;
      display: flex; flex-direction: column;
    }
    .periode-card:hover { border-color: #C8A84B; transform: translateY(-3px); box-shadow: 0 12px 32px #C8A84B22; }

    .periode-card h2 { font-size: 1.05rem; font-weight: 800; color: #C8A84B; margin-bottom: 6px; }
    .periode-lieu { font-size: 0.82rem; color: #8fa8c8; margin-bottom: 6px; }
    .periode-dates { font-size: 0.88rem; color: #8fa8c8; margin-bottom: 14px; }
    .periode-card .btn-gold { margin-top: auto; }
    .periode-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .periode-tarif { font-size: 1.05rem; font-weight: 900; color: #fff; }
    .periode-tarif span { font-size: 0.72rem; color: #8fa8c8; font-weight: 400; margin: 0 2px; }
    .periode-places { font-size: 0.78rem; color: #8fa8c8; }
    .periode-places.complet { color: #fc8181; font-weight: 700; }

    .btn-gold {
      background: #C8A84B; color: #0d1f3c; border: none; border-radius: 10px;
      padding: 12px; font-size: 0.95rem; font-weight: 800; cursor: pointer;
      width: 100%; transition: opacity 0.2s;
    }
    .btn-gold:hover { opacity: 0.85; }
    .btn-gold:disabled { background: #4a5568; color: #a0aec0; cursor: not-allowed; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: #000a; z-index: 999;
      overflow-y: auto; padding: 24px 16px;
    }
    .modal-overlay.show { display: block; }
    .modal-box {
      background: #162847; border: 1.5px solid #C8A84B44; border-radius: 18px;
      max-width: 480px; margin: 20px auto; padding: 28px;
    }
    .modal-box h3 { color: #C8A84B; font-size: 1.05rem; margin-bottom: 4px; }
    .modal-box .sub { color: #8fa8c8; font-size: 0.85rem; margin-bottom: 20px; }
    .modal-box label { display: block; font-size: 0.82rem; font-weight: 600; color: #8fa8c8; margin: 10px 0 4px; }
    .modal-box input, .modal-box textarea {
      background: #0d1f3c; border: 1.5px solid #1e3a5f; color: #fff; margin-bottom: 4px;
    }
    .modal-box input:focus, .modal-box textarea:focus { border-color: #C8A84B; }
    .modal-box textarea::placeholder { color: #5f7ba3; }
    .modal-close {
      float: right; background: transparent; border: 1.5px solid #8fa8c8; color: #8fa8c8;
      border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 0.85rem;
    }

    .confirmation { text-align: center; }
    .confirmation .check { font-size: 2.6rem; margin-bottom: 10px; }
    .confirmation h3 { color: #C8A84B; margin-bottom: 10px; }
    .confirmation p { color: #8fa8c8; font-size: 0.9rem; line-height: 1.6; margin-bottom: 16px; }
    .virement-box {
      background: #0d1f3c; border: 1px solid #1e3a5f; border-radius: 12px;
      padding: 16px 20px; text-align: left; font-size: 0.88rem; color: #fff; margin-bottom: 16px;
    }
    .virement-box div { display: flex; justify-content: space-between; padding: 4px 0; }
    .virement-box strong { color: #C8A84B; }

    .jours-checklist {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
      background: #0d1f3c; border: 1.5px solid #1e3a5f; border-radius: 10px;
      padding: 10px 14px; margin: 8px 0 4px;
    }
    .jour-check { display: flex !important; align-items: center; gap: 8px; color: #fff; font-size: 0.85rem; font-weight: 400 !important; margin: 4px 0 !important; text-transform: capitalize; }
    .jour-check input { width: auto; margin: 0; }

    #semaines-checklist { margin-bottom: 4px; }
    .semaine-block {
      background: #0d1f3c; border: 1.5px solid #1e3a5f; border-radius: 10px;
      padding: 10px 14px; margin-bottom: 8px;
    }
    .semaine-check { display: flex !important; align-items: center; gap: 8px; color: #fff; font-size: 0.85rem; font-weight: 400 !important; margin: 0 !important; }
    .semaine-check input { width: auto; margin: 0; }
    .semaine-check strong { color: #C8A84B; }

    .tarif-reduit-row {
      display: flex !important; align-items: center; gap: 8px; margin-top: 14px !important;
      color: #fff !important; font-size: 0.85rem; font-weight: 400 !important;
    }
    .tarif-reduit-row input { width: auto; margin: 0; }

    .consent-row {
      display: flex !important; align-items: flex-start; gap: 8px; margin-top: 14px !important;
      color: #fff !important; font-size: 0.85rem; font-weight: 400 !important; line-height: 1.4;
    }
    .consent-row input { width: auto; margin: 3px 0 0; flex-shrink: 0; }

    .montant-box {
      background: #0d1f3c; border: 1px solid #C8A84B44; border-radius: 10px;
      padding: 12px 16px; margin-top: 14px; color: #fff; font-size: 0.85rem;
    }

    .info-collation {
      background: #0d1f3c; border: 1px solid #1e3a5f; border-radius: 10px;
      padding: 10px 14px; margin-top: 14px; color: #8fa8c8; font-size: 0.78rem; line-height: 1.5;
    }

    .admin-link {
      position: fixed; top: 16px; right: 16px;
      display: flex; align-items: center; gap: 6px;
      background: #162847; border: 1.5px solid #1e3a5f; color: #8fa8c8;
      border-radius: 8px; padding: 8px 14px; font-size: 0.8rem; font-weight: 600;
      text-decoration: none; transition: all 0.15s;
    }
    .admin-link:hover { border-color: #C8A84B; color: #C8A84B; }
  </style>
</head>
<body>

  <a href="admin.html" class="admin-link"><i data-lucide="lock" width="15" height="15"></i> Accès admin</a>

  <div class="hero">
    <img src="assets/logo.jpg" alt="Logo RCFC"/>
    <h1>Stages Vacances</h1>
    <p>Ramonville Coteaux Football Club</p>
    <div class="divider"></div>
  </div>

  <div class="infos-pratiques">
    <div><i data-lucide="calendar-days" width="18" height="18"></i> Du <strong>lundi au vendredi</strong></div>
    <div><i data-lucide="clock" width="18" height="18"></i> <strong>9h – 17h</strong></div>
    <div><i data-lucide="calendar-check" width="18" height="18"></i> Semaine complète <strong>ou à la carte</strong></div>
    <div><i data-lucide="users" width="18" height="18"></i> <strong>-20%</strong> dès le 2ᵉ enfant</div>
  </div>

  <div class="periodes-grid" id="periodes-grid">
    <div class="empty-state" style="color:#8fa8c8;grid-column:1/-1;">Chargement des périodes...</div>
  </div>

  <!-- Modal inscription -->
  <div class="modal-overlay" id="modal-inscription">
    <div class="modal-box">
      <button class="modal-close" onclick="fermerModal()">✕ Fermer</button>
      <div id="modal-form-content"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
