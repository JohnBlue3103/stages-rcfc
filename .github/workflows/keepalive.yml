name: Keep Supabase alive

# Le plan gratuit Supabase met un projet en pause après 7 jours sans requête API.
# Ce workflow envoie une requête légère toutes les 4 jours pour éviter la pause,
# ce qui est utile ici car les inscriptions ne se font que quelques fois par an.
on:
  schedule:
    - cron: '0 6 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/periodes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
